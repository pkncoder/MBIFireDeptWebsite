services:
  webserver:
    image: nginx:stable-alpine
    container_name: nginx_production
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount your web files into the standard Nginx html directory
      - ./web:/usr/share/nginx/html:ro
      # Mount your assets into a dedicated folder inside the container
      - ./assets:/usr/share/nginx/assets:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

