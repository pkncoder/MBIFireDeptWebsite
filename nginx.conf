user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;

        # 1. Main site entry point (points to /web inside your layout)
        location / {
            # Appends /html/ to find index.html at /usr/share/nginx/html/html/index.html
            root /usr/share/nginx/html/html; 
            index index.html index.htm;
            try_files $uri $uri/ =404;
        }

        # 2. Map global styles and scripts to their folders inside /web
        location /script/ {
            root /usr/share/nginx/html;
        }

        location /style/ {
            root /usr/share/nginx/html;
        }

        # 3. Dedicated assets route (images, data, etc.)
        location /assets/ {
            # Nginx appends the URI, looking for files in /usr/share/nginx/assets/
            root /usr/share/nginx; 
        }
    }
}
