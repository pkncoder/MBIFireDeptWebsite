<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Local Fire Department</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../style/root.css" />
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold text-danger" href="index.html"
                    >Station 1</a
                >
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="about.html">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="officers.html"
                                >Officers</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="calendar.html"
                                >Calendar</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="volunteer.html"
                                >Volunteer</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link btn btn-danger text-white ms-lg-3 px-3"
                                href="donate.html"
                                >Donate</a
                            >
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <main class="container my-5">
            <div class="row">
                <div class="col-md-6 offset-md-3">
                    <h2 class="fw-bold mb-4">Volunteer Application</h2>
                    <div class="card border-0 shadow-sm p-4">
                        <form id="volunteerForm">
                            <div class="mb-3">
                                <label for="name" class="form-label fw-bold"
                                    >Full Name</label
                                >
                                <input
                                    type="text"
                                    class="form-control bg-light border-0"
                                    id="name"
                                    required
                                />
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold"
                                    >Email address</label
                                >
                                <input
                                    type="email"
                                    class="form-control bg-light border-0"
                                    id="email"
                                    required
                                />
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label fw-bold"
                                    >Why do you want to join?</label
                                >
                                <textarea
                                    class="form-control bg-light border-0"
                                    id="message"
                                    rows="4"
                                    required
                                ></textarea>
                            </div>
                            <button
                                type="submit"
                                class="btn btn-danger w-100 py-2 fw-bold"
                            >
                                Submit Request
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../script/root.js"></script>
    </body>
</html>
